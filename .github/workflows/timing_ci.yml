name: LCLS Timing Core Integration
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:

  lint:
    name: Linting
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tclsh ghdl
          python -m pip install --upgrade pip
          python -m pip install -r pip_requirements.txt

      - name: Clone dependencies
        run: |
          git clone --depth 1 -b main https://github.com/slaclab/ruckus ruckus
          git clone --depth 1 -b main https://github.com/slaclab/surf surf

      - name: Tool versions
        run: |
          python tests/common/tool_versions.py surf ruckus ghdl python flake8 vsg

      - name: Import HDL libraries
        run: |
          make MODULES=$PWD import

      - name: Whitespace, non-ASCII, and tabs
        run: |
          python tests/common/lint_checks.py text

      - name: Python syntax and flake8
        run: |
          python -m compileall -f -q python/ tests/
          flake8 --count python/ tests/

      - name: VHDL style on new files
        run: |
          python tests/common/lint_checks.py vsg

      - name: Compliance audit (warn-only)
        run: |
          python tests/common/compliance_audit.py audit tests --output "$RUNNER_TEMP/audit.txt"
          cat "$RUNNER_TEMP/audit.txt"
          {
            echo "### Compliance audit"
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# ----------------------------------------------------------------------------

  test:
    name: "RTL test: ${{ matrix.module }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [common, lcls1_evr, lcls2_core]
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tclsh ghdl iverilog
          python -m pip install --upgrade pip
          python -m pip install -r pip_requirements.txt

      - name: Clone dependencies
        run: |
          git clone --depth 1 -b main https://github.com/slaclab/ruckus ruckus
          git clone --depth 1 -b main https://github.com/slaclab/surf surf

      - name: Simulator versions
        run: |
          ghdl --version
          iverilog -V

      - name: Tool versions
        run: |
          python tests/common/tool_versions.py surf ruckus ghdl iverilog python cocotb cocotb-test

      - name: Import HDL libraries
        run: |
          make MODULES=$PWD import

      - name: Run tests
        run: |
          python -m pytest -v -n auto --dist=worksteal tests/${{ matrix.module }}

# ----------------------------------------------------------------------------

  rogue_test:
    name: Rogue Regression Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -el {0}
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: lcls-timing-core-rogue-test
          environment-file: conda-rogue.yml
          auto-activate: false
          conda-remove-defaults: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pip_requirements.txt

      - name: Verify Rogue
        # Fail early if the conda environment did not activate; a missing
        # Rogue would turn every test below into a silent skip.
        run: |
          python -c "import rogue, pyrogue; print(rogue.Version.current())"

      - name: Tool versions
        run: |
          python tests/common/tool_versions.py --remote-deps surf ruckus python rogue cocotb cocotb-test

      - name: Run Rogue tests
        # PYTHONPATH makes the tests exercise the in-repo python/ package
        # rather than an installed copy.
        env:
          LCLS_REQUIRE_ROGUE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          PYTHONPATH="$PWD/python" python -m pytest -v -n auto tests/rogue

# ----------------------------------------------------------------------------

  test_and_document:
    name: Test And Generate Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:

      # This step checks out a copy of your repository.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install doxygen doxygen-doc doxygen-latex doxygen-gui graphviz

      - name: Tool versions
        run: |
          python tests/common/tool_versions.py --remote-deps surf ruckus python doxygen

      - name: Generate Documentation
        run: |
          doxygen Doxyfile

      - name: Deploy Documentation
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: doxygen/html

# ----------------------------------------------------------------------------

  gen_release:
    needs: [lint, test, rogue_test, test_and_document]
    uses: slaclab/ruckus/.github/workflows/gen_release.yml@main
    with:
      version: '1.0.0'
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

# ----------------------------------------------------------------------------
