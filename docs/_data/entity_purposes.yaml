# Authored purposes for the entity reference, keyed by repo-relative file path.
# Each value is one to three plain sentences written from the RTL and its tests,
# never copied from the banner header of the file. The generator fails when a
# rendered file has no entry here or an entry has no rendered file.

LCLS-I/evr/EvrV1Core.vhd: >-
  Top level of the LCLS-I EVR core. It joins the EvrV1Reg AXI-Lite register
  file on axiClk with the EvrV1EventReceiver on evrClk, which turns the
  received event codes into 12 trigger outputs, an event stream, and
  interrupt status. ENDIAN_G true byte-swaps the AXI-Lite data and strobes
  for a big endian host.

LCLS-I/evr/EvrV1CoreIsrCtrl.vhd: >-
  Receive and interrupt front end of the LCLS-I EVR. On evrClk it raises
  rxLinkUp only after gtLinkUp has stayed high without decode or disparity
  errors for 0xFFFFFF clocks, then registers the GT data and flags later
  errors on rxError. On an interrupt request it sends an IRQ message on an
  AXI stream and waits for software, or, when the isrSelect bit at 0x0 is
  clear, reads the interrupt flags and registers itself over an AXI-Lite
  master and streams data buffer, event, FIFO full, pulse, heartbeat, and
  violation messages tagged by TDEST.

LCLS-I/evr/EvrV1Databuff.vhd: >-
  Dual-clock 2048 byte receive buffer for the LCLS-I data buffer. Bytes are
  written one at a time on clka at an 11-bit byte address and read back as
  little endian 32-bit words on clkb at a 9-bit word address, with one clkb
  clock of read latency. It is four 8-bit surf SimpleDualPortRam lanes with
  no reset, and words never written read 0 in simulation.

LCLS-I/evr/EvrV1DbusDecode.v: >-
  Decoder for the LCLS-I data buffer carried on the event stream. After a
  K28.0 start code it stores alternating filler and data bytes into
  EvrV1Databuff on EventClock until a K28.1 or K28.5 end code, checks the
  complemented 16-bit sum in the next two bytes, and reports the byte count
  on rxSize, dbrx while receiving, dbrdy when a buffer is ready, and dbcs on
  a checksum error. Icarus rejects the unsized constant in its rxSize
  assignment, so the regression simulates a patched copy of this file.

LCLS-I/evr/EvrV1EventRAM256x32.vhd: >-
  True dual-port 256 by 32 bit RAM, a surf TrueDualPortRam in read-first
  mode, that the LCLS-I EVR uses for its event code maps. Each port has its
  own clock, enable, write enable, address, and data, reads take one clock,
  and a write to the address being read returns the old word on that port in
  the same cycle.

LCLS-I/evr/EvrV1EventReceiver.vhd: >-
  Event decoder of the LCLS-I EVR on evrClk. The GT receive words feed the
  data buffer decoder, a time of day receiver, and four 256 by 32 event RAMs
  (reset, set, pulse, and interrupt maps) that drive twelve
  EvrV1EventReceiverChannel pulse generators for trigOut. It also queues
  event time stamps in EvrV1TimeStampFIFO, watches the 0x7A heartbeat code
  with EvrV1HeartBeat, sets the interrupt flags, and crosses the
  configuration and status to axiClk through surf synchronizers.

LCLS-I/evr/EvrV1EventReceiverChannel.v: >-
  One LCLS-I EVR pulse channel. When myEvent rises it waits myDelay ticks
  and then holds the output for myWidth ticks, where a tick is one Clock or,
  for a myPreScale above 1, myPreScale clocks; a width of 0 gives no pulse
  and myPolarity sets the active level. setPulse forces the output on and
  resetPulse forces it off, with setPulse winning, and Reset returns the
  channel to idle.

LCLS-I/evr/EvrV1HeartBeat.vhd: >-
  Heartbeat timeout monitor on eventClk. Event code 0x7A reloads a 32-bit
  counter from uSecDividerReg, any other code lets it count down, and
  heartBeatTimeOut pulses for one clock when the count reaches 0. With no
  0x7A the counter wraps and times out again after 4294967296 clocks, and
  reset clears the count.

LCLS-I/evr/EvrV1Pkg.vhd: >-
  The EvrV1StatusType and EvrV1ConfigType records that connect EvrV1Reg to
  EvrV1EventReceiver. Status carries the time stamps, time stamp FIFO, event
  RAM read data, interrupt flags, and data buffer state out of the receiver,
  and config carries the pulse, output map, event RAM, interrupt, and data
  buffer controls into it. EVR_V1_CONFIG_INIT_C is the all-zero
  configuration.

LCLS-I/evr/EvrV1Reg.vhd: >-
  AXI-Lite register file of the LCLS-I EVR on axiClk. It decodes writes into
  the EvrV1ConfigType outputs (pulse control, prescale, delay, and width for
  twelve channels, output map, event RAM windows, interrupt control and
  clear, data buffer control) and builds reads from the EvrV1StatusType
  input and the firmware version of BUILD_INFO_G. A read after a reset or a
  time stamp latch write waits LATCH_TS_LATENCY_G clocks, and unmapped,
  read-only, or unaligned accesses answer DECERR.

LCLS-I/evr/EvrV1TimeStampFIFO.vhd: >-
  512 word, 72 bit first-word-fall-through FIFO between two clocks for the
  LCLS-I EVR time stamped event records, built from a surf FifoAsync. It
  keeps the first 512 words written and drops a word written into a full
  FIFO; the port named full is the overflow pulse, high for one cycle after
  such a write, and both data counts are exposed.

LCLS-I/evr/EvrV1TimeStampGenerator.v: >-
  Free-running 64-bit time stamp for the LCLS-I EVR in a single Clock domain.
  TimeStamp counts up by 1 on every Clock, and every 330556 clocks a reload
  puts the seconds counter in bits 63:32 and clears the low word while the
  seconds counter increments. Reset clears the seconds counter, the reload
  counter, and TimeStamp.

LCLS-I/evr/EvrV1TimeofDayReceiver.v: >-
  Receives the LCLS-I time of day from the event stream. Each 0x70 or 0x71
  event code shifts a 0 or 1 into a 32-bit seconds word, most significant
  bit first, and the 0x7D code latches the word into bits 63:32 of TimeStamp
  with the low word cleared, after which TimeStamp counts up by 1 each
  clock. secondsShift shows the word as it arrives, and Reset clears the
  seconds, the bit pointer, and TimeStamp.

LCLS-II/core/rtl/BsaControl.vhd: >-
  Older definition of the entity BsaControl, the acquisition state of one BSA
  definition: it counts active cycles down from nToAvg and averages down from
  avgToWr, and treats an avgToWr of 0 as persist, as observed, intent
  unconfirmed. It has no tmo and tmocnt timeout inputs and no ruckus.tcl loads
  it, so the definition in use for this entity is BsaControlv2.vhd.

LCLS-II/core/rtl/BsaControlv2.vhd: >-
  Acquisition state of one BSA definition in the txclk domain: after the
  bsadef init input rises while enabled it pulses bsaInit, then drives
  bsaActive while the selected rate and destination match, bsaAvgDone at each
  average boundary set by nToAvg, and bsaDone after avgToWr averages, or never
  when avgToWr is 0xFFFF. The nToAvgOut and avgToWrOut status outputs count
  up, and the optional tmo and tmocnt inputs can assert bsaDone after an
  average. This is the definition of entity BsaControl that ruckus loads.

LCLS-II/core/rtl/ClockTime.vhd: >-
  Free-running 64-bit time counter in the clkB domain, with nanoseconds in the
  low word and seconds in the high word. Each clkB cycle adds step
  nanoseconds, plus one more on the cycles where the fractional remainder
  (remainder over divisor) overflows, so the defaults advance 5 and 5/13 ns
  (1300/7 MHz). A time written on clkA with wrEnA crosses through a FIFO and
  loads when wrEnB is high, and wrEnB also copies the current time back to
  clkA as rdData.

LCLS-II/core/rtl/ClockTime_186MHz.vhd: >-
  Same time counter as ClockTime with the step fixed at 5 and 5/13 ns (1300/7
  MHz) instead of taken from inputs. No ruckus.tcl loads it and nothing else
  in the repository instantiates it.

LCLS-II/core/rtl/CtrControl.vhd: >-
  Counter of the txclk cycles, while enabled, in which the rate selected by
  ctrdef through EventSelect is set and the destination mask of ctrdef matches
  the beam destination, using the same destination test as BsaControl. A
  rising edge of ctrrst latches the count to the count output and restarts it
  at 0, and as observed a qualifying cycle on the latch edge is not counted,
  intent unconfirmed.

LCLS-II/core/rtl/Divider.vhd: >-
  Prescaler that raises trigO for one sysClk cycle every divisor cycles while
  enable is high, counting from 1 up to divisor and restarting at 1. Holding
  enable low freezes the count and the trigO level, clear with enable low
  forces trigO low, and sysReset restarts the count at 1 and drops trigO. A
  divisor of 0 never matches until the Width-bit counter wraps, so at the
  default Width of 4 the period is 16 cycles.

LCLS-II/core/rtl/EthTimingModule.vhd: >-
  With STREAM_L1_G true, copies the 704 bit LCLS-I timing stream into an AXI-
  Stream frame on each timingStrobe and passes it to ethClk through a FIFO,
  but only while a timeout flag is clear. The flag starts set and clears on
  the first inbound beat on ibEthMsgMaster, and the RTL sets it again after
  2^29 ethClk cycles without one. With STREAM_L1_G false the module only holds
  the inbound slave ready.

LCLS-II/core/rtl/EventSelect.vhd: >-
  Picks one bit of the timing pattern for a definition, by rateType. Type 00
  takes fixedRate indexed by fxRateSel, type 01 takes acRate indexed by
  acRateSel when the acTSmask bit of the current time slot is set, type 10
  takes bit seqbit of the registered expSeq word chosen by seqword (zero from
  word 18 up), and type 11 gives 0.

LCLS-II/core/rtl/GthRxAlignCheck.vhd: >-
  Checks the comma alignment latency of a GT receiver. After resetDone it
  reads the DRP latency register through an AXI-Lite master, locks when the
  low seven bits match the target under the mask, and otherwise pulses
  resetOut and reads again, counting every value in a 40 entry histogram that
  an AXI-Lite slave block exposes with the target, mask, last value, and clock
  frequencies. As observed, a latency of 40 or more indexes past the histogram
  and stops the simulator, intent unconfirmed.

LCLS-II/core/rtl/TPFifo.vhd: >-
  Caches timing message words in a delay RAM and, when the trig input selects
  a ready word at a start of frame, copies that frame into an asynchronous
  FIFO read on rdClk, preceded by a word holding the mask wsel. Words are kept
  only where the wsel bit indexed by wrDataWord is set, and the full flag
  latches until rst. No ruckus.tcl loads it and nothing else in the repository
  instantiates it.

LCLS-II/core/rtl/TPGMini.vhd: >-
  Generates LCLS-II timing frames. A base-rate divider paces the frames and
  increments the pulse ID, fixed-rate dividers and one BsaControl per
  definition fill the TimingMessageType frame, and TPSerializer and
  TimingSerializer send it on txData and txDataK with a CRC. It also keeps the
  status counters that TPGMiniReg reads, and the STREAM_INTF generic hands the
  frame out as a stream instead.

LCLS-II/core/rtl/TPGMiniCore.vhd: >-
  Top level of the mini pattern generator. It crosses the AXI-Lite port to
  txClk, instantiates TPGMiniReg for the registers, TPGMini for the LCLS-II
  frame on txData(1), and TPGMiniStream for the LCLS-I stream on txData(0),
  and passes txResetO, txLoopback, txInhibit, and txPolarity through from the
  register block. GHDL cannot analyze it because TPGMiniReg fails first, so
  its registers are checked through the PyRogue model and the register drift
  check.

LCLS-II/core/rtl/TPGMiniEdef.vhd: >-
  One event definition of the mini generator. When cnfg.wrEn is set for its
  EDEF_G number while it is idle, it latches navg, nsmp, rate, slot, and sevr,
  pulses init, and becomes active. While active it counts strb pulses into
  averages of navg and nsmp samples, raising avgD on each average and allD on
  the last, with its state advancing only on cen, and smin and smaj carry the
  severity bits.

LCLS-II/core/rtl/TPGMiniEdefPkg.vhd: >-
  Declares the configuration record of one mini event definition
  (TPGMiniEdefConfigType with navg, nsmp, edef, slot, rate, sevr, and a write
  enable), its field subtypes and reset constant, and toSlv and fromSlv
  conversions to the packed register word. TPGMiniReg, TPGMiniCore,
  TPGMiniStream, and TPGMiniEdef use it.

LCLS-II/core/rtl/TPGMiniEdefTb.vhd: >-
  Port-less testbench for TPGMiniStream. It runs a 100 ns clock, releases
  reset after 4 cycles, writes one event definition (navg 2, nsmp 1, rate 1,
  slot 2) at cycle 40, prints a trace of the timeslot and event definition
  flags, and stops itself after 1600 cycles. It has no assertions.

LCLS-II/core/rtl/TPGMiniReg.vhd: >-
  AXI-Lite register block of TPGMiniCore. It decodes the clock select, base
  divisor, fixed rate, pulse ID, timestamp, interval, and BSA definition
  registers into the TPGConfigType and TPGMiniEdefConfigType outputs, returns
  TPGStatusType counters on reads, and drives txReset, txLoopback, and
  txInhibit, while irqEnable and irqReq are tied low. GHDL cannot analyze this
  file, so its registers are checked through the PyRogue model and the
  register drift check.

LCLS-II/core/rtl/TPGMiniStream.vhd: >-
  Generates the LCLS-I timing stream for the mini generator. A base-rate
  divider and fixed-rate dividers drive the event codes, the pulse ID (which
  wraps at 0x1FFDF), the time slot, a ClockTime timestamp, and NUM_EDEFS
  TPGMiniEdef blocks, and TimingStreamTx sends them as event code and data
  buffer bytes on txData and txDataK. The simData, simEvents, and simStrobe
  outputs expose the same data to simulation.

LCLS-II/core/rtl/TPGNotify.vhd: >-
  Interrupt notifier for the pattern generator. When irqEnable and irqReq are
  both high, synchronized to txClk, it counts the event and presents a one
  word AXI-Stream message with the 32 bit count and tDest 0xFF. As observed,
  nothing in the file clears tValid once it is set, intent unconfirmed (issue
  240), and no ruckus.tcl loads it.

LCLS-II/core/rtl/TPGPkg.vhd: >-
  Declares the limits and records shared by the pattern generator blocks: the
  fixed rate, AC rate, and sequence depth constants, the BsaDefType and
  CtrDefType definition records, and the TPGConfigType and TPGStatusType
  records exchanged with the register block, with their reset constants.
  BsaControl, CtrControl, EventSelect, TPGMini, TPGMiniReg, and TPGMiniStream
  use it.

LCLS-II/core/rtl/TPSerializer.vhd: >-
  Latches the 944 bit TimingMessageType on fiducial and shifts it out as 59
  16-bit words, least significant word first, on a TimingSerialType stream
  that TimingSerializer pulls with advance. The Id generic is returned as the
  streamId of the segment.

LCLS-II/core/rtl/TimingCore.vhd: >-
  Family-agnostic timing receiver around the GT interface. An AXI-Lite
  crossbar serves TimingRx at offset 0x00000, ring buffers of the raw GT words
  at 0x10000 and of the decoded messages at 0x20000 (present when AXIL_RINGB_G
  is true), and TPGMiniCore at 0x30000. It passes either the LCLS-I stream or
  the LCLS-II message to appTimingBus on appTimingClk according to the
  selected mode, and adds EthTimingModule when STREAM_L1_G is true.

LCLS-II/core/rtl/TimingDeserializer.vhd: >-
  Receives the 16-bit character stream of a timing link. A K23.7 start of
  frame opens a frame, each segment header routes its words to the stream with
  the matching streamId (words for an unknown id are sunk), K28.0 ends a
  segment, and K29.7 followed by two CRC words ends the frame. It outputs
  fiducial, sof, and eof strobes and raises crcErr when the received CRC32
  differs from the one it computed.

LCLS-II/core/rtl/TimingFrameRx.vhd: >-
  LCLS-II receiver front end. TimingDeserializer splits the character stream
  into 16 segment streams, a TimingSerialDelay delays the 944 bit message on
  stream 0 by messageDelay clocks onto timingMessage with a strobe, and one
  more per stream 1 to 15 delivers the extension messages. A message version
  other than 1 is flagged on staData and rxVersion and lowers
  timingMessageValid, which as observed settles one cycle after the strobe,
  intent unconfirmed.

LCLS-II/core/rtl/TimingGthWrapper.vhd: >-
  Wraps the TimingGth transceiver IP as a timing receive link: it passes the
  reference clock, the differential receive pair, and txInhibit to the IP,
  drives the transmit data to zero, and returns the recovered clock, receive
  data, K flags, disparity and decode errors, and the receive reset done. The
  IP is declared as a component and is not part of this repository, and no
  ruckus.tcl loads the file.

LCLS-II/core/rtl/TimingMsgAxiRingBuffer.vhd: >-
  Records timing messages for readout over AXI-Lite. TimingMsgToAxiStream
  splits each message into 32 bit words and every valid word is written to a
  surf AxiLiteRingBuffer in the timing clock domain. Because
  TimingMsgToAxiStream never ends its stream, zero words follow each message
  while recording stays enabled, as observed, intent unconfirmed.

LCLS-II/core/rtl/TimingMsgDelay.vhd: >-
  Delays decoded timing messages by a programmable number of timingClk cycles.
  Each strobed message is stored in a FIFO with the free-running counter value
  plus delay and read out, with timingMessageStrobeOut, when the counter
  reaches that value. As observed, the FIFO_ADDR_WIDTH_G generic is declared
  but not used.

LCLS-II/core/rtl/TimingMsgToAxiStream.vhd: >-
  Copies a timing message vector on timingMessageStrobe and shifts it out
  SHIFT_SIZE_G bits at a time, least significant bits first, through an
  AxiStreamFifoV2 that converts to the configured output width. The frame
  counter is cleared every cycle, so as observed tLast never asserts and zero
  beats follow the message indefinitely, intent unconfirmed.

LCLS-II/core/rtl/TimingPkg.vhd: >-
  Declares the timing link definitions: the 8b10b character constants (the
  K28.5 comma, start and end of frame, K28.0, and K28.1), the 944 bit LCLS-II
  TimingMessageType, the 704 bit LCLS-I TimingStreamType with its 416 bit data
  buffer, the extension, bus, and PHY control records, and the functions that
  convert them to and from bit vectors. TimingCore, TimingRx, the serializers,
  and the EVR blocks use it.

LCLS-II/core/rtl/TimingRx.vhd: >-
  Receiver that parses both timing protocols. CLKSEL_MODE_G keeps the LCLS-I
  receiver (TimingStreamRx), the LCLS-II receiver (TimingFrameRx), or both,
  and in a mode with no receiver for a protocol the outputs for that protocol
  stay at their reset values. An AXI-Lite block at 0x00 to 0x40 holds the
  status counters, the receiver select and reset bits at 0x20, the message
  delay at 0x24, and the clock counts and version.

LCLS-II/core/rtl/TimingSerialDelay.vhd: >-
  Delays a received frame by a programmable number of clocks. The words of
  each frame, accepted on advance_i after fiducial_i, go into a FIFO and the
  frame is released on strobe_o with valid_o when its delay expires, and
  overflow_o flags a frame pipeline overrun. As observed, frame N leaves 4 +
  delay clocks after the fiducial of frame N + 1, and stream_i ready is never
  read, intent unconfirmed.

LCLS-II/core/rtl/TimingSerializer.vhd: >-
  Builds the LCLS-II 16-bit character stream. It sends K28.5 commas when idle,
  an alignment comma and K23.7 start of frame on fiducial, then each ready
  stream as a segment with a header word carrying streamId, last, and offset,
  K28.0 between segments, K29.7 at the end of the frame, and the frame CRC32
  in two words. It pulls the words of a stream with advance.

LCLS-II/core/rtl/TimingStreamRx.vhd: >-
  Decodes the LCLS-I stream. A K28.0 on the high half opens a data buffer that
  closes at K28.5 or K28.1, event codes 0x70 and 0x71 shift in the pulse ID
  bit by bit, and 0x7D starts a counted frame of event code flags that ends
  after 0x36B0 cycles. It then strobes the stream with the newest data buffer
  or one from two frames earlier, selected by timingMessageNoDely, and any
  decode or disparity error resets the decoder.

LCLS-II/core/rtl/TimingStreamTx.vhd: >-
  Generates the LCLS-I stream. On fiducial it latches the data buffer, pulse
  ID, and event codes, sends the data buffer bytes on the high half between
  K28.0 and K28.1, then the pulse ID bit by bit as event codes 0x70 and 0x71,
  an 0x7D marker, and a scan of event codes 0 to 255 on the low half, with
  K28.5 commas on the idle half cycles.

LCLS-II/core/rtl/WordSerializer.vhd: >-
  Latches NWORDS_G 16-bit words on fiducial and shifts them out one per
  advance on a TimingSerialType stream, the same shift register as
  TPSerializer for an arbitrary word vector. Ready stays low when the stream
  is not ready at the latch and drops after the last word.

LCLS-II/core/rtl/default/TimingExtnPkg.vhd: >-
  Default definition of the extension interface, which a downstream project
  can replace with its own package of the same name. It declares
  ExptMessageType (two 32 bit base-rate counters and a 256 bit IRIG time code,
  320 bits on stream id 2), the stream count and word counts, and conversions
  between the bit vector and the record.

LCLS-II/core/tb/TimingSerialDelay_tb.vhd: >-
  Self-checking testbench for TimingSerialDelay with no ports. It runs a 10 ns
  clock with a fiducial every 66 clocks, 16 word frames, and periodic resets
  of the delay line, and asserts the frame contents, the overflow flag, and
  the delay of each frame. As observed its 8 bit frame tag wraps after about
  169 us and the delay check fails after the wrap.

LCLS-II/evr/rtl/EvrV2Axi.vhd: >-
  AXI-Lite register block of the LCLS-II EVR channels, on axiClk. Per
  channel it holds the enable bit and the rateSel and destSel words at a 32
  byte stride from 0x020 plus a read-only event count, and it has the count
  reset (0x010) and trigger select (0x014) bits; with DMA_ENABLE_G true it
  also maps the interrupt, debug, threshold, and BSA words. The
  channelConfig, irqEnable, rstCount, trigSel, and dmaFullThr outputs follow
  the registers, and word 0x008 is commented out of the RTL, so it reads 0.

LCLS-II/evr/rtl/EvrV2Cache.vhd: >-
  Dual-clock capture memory that stores 192-bit entries written on clka and
  reads each entry back as six 32-bit words on clkb, lowest word first. Both
  pointers stop at entry 1023, so empty rises only when the read pointer
  reaches that entry and only word 0 of entry 1023 can be read, as observed
  with intent unconfirmed.

LCLS-II/evr/rtl/EvrV2ChannelReg.vhd: >-
  AXI-Lite register file for NCHANNELS_G EVR event-select channels. Each
  channel group has a 256 byte window (4096 bytes when EVR_CARD_G is true)
  holding the enable, rateSel, and destSel configuration, the BSA and DMA
  words when DMA_ENABLE_G is true, and a read-only event count. Group i
  drives channelConfig(i), and an address one decode window above group 0
  aliases it.

LCLS-II/evr/rtl/EvrV2CoreChannels.vhd: >-
  Event-select half of the LCLS-II EVR. An EvrV2ChannelReg on axilClk
  configures NCHANNELS_G EvrV2EventSelect channels on evrClk, which pick
  frames from the timing bus after EvrV2FromV1 has converted an LCLS-I
  stream when evrModeSel is low. trigPulse(i) is high for one step per frame
  channel i selects, and the output also carries the time stamp, BSA, and
  dmod fields of the bus; COMMON_CLK_G true drops the clock-domain
  synchronizers.

LCLS-II/evr/rtl/EvrV2CorePulseGen.vhd: >-
  Self-contained LCLS-II EVR with 12 channels and 12 trigger outputs behind
  one AXI-Lite crossbar: EvrV2Axi at AXIL_BASE_ADDR_G and EvrV2TrigReg at
  +0x200 configure an EvrV2EventSelect per channel and an EvrV2Trigger per
  output, driven by the timing bus on evrClk. It maps an LCLS-I stream to an
  LCLS-II message inline when evrModeSel is low and exposes the trigger
  delay tap load, write, and read ports. Only the trigger groups at 0x200
  and 0x300 answer, as triggers 2 and 3, as observed with intent
  unconfirmed.

LCLS-II/evr/rtl/EvrV2CoreTriggers.vhd: >-
  Trigger half of the LCLS-II EVR. An AXI-Lite crossbar on axilClk places an
  EvrV2ChannelReg for NCHANNELS_G channels and an EvrV2TrigReg for
  NTRIGGERS_G triggers at AXIL_BASEADDR_G and at +0x1000 (+0x20000 when
  EVR_CARD_G is true). On evrClk each trigger is an EvrV2Trigger armed by
  its channel and fired on the strobe, and each adjacent pair passes through
  EvrV2TriggerCompl for an optional AND or OR.

LCLS-II/evr/rtl/EvrV2EventSelect.vhd: >-
  Decides on each strobe whether one event-select channel fires. selectOut
  is registered one clock after strobeIn when the channel is enabled, its
  rate selection matches the frame (a fixed rate bit, an AC rate bit gated
  by the time slot mask, or a bit of one of the 18 control words), and its
  destination selection matches the beam request; dmaOut adds dmaEnabled. In
  GHDL a control word index above 17 stops the simulation with an index out
  of bounds.

LCLS-II/evr/rtl/EvrV2FromV1.vhd: >-
  Converts an LCLS-I timing stream into an LCLS-II timing message,
  registered on clk when timingIn.strobe is high. With disable low it
  rebuilds the pulse ID, time stamp, BSA, AC rate, modifier, and control
  words from the stream and makes up a beam request destination from dmod
  bits 61, 60, and 83; with disable high it passes timingIn.message through.
  Message fields it never assigns keep their previous value, as observed
  with intent unconfirmed.

LCLS-II/evr/rtl/EvrV2Module.vhd: >-
  Top level of the small LCLS-II EVR. An AXI-Lite crossbar splits axiClk
  traffic between EvrV2Axi at AXIL_BASEADDR and EvrV2TrigReg at +0x200, and
  the channel and trigger configurations cross to evrClk through
  synchronizers into NCHANNELS_G EvrV2EventSelect units and NTRIGGERS_G
  EvrV2Trigger units behind an EvrV2FromV1 stage. Event counts cross back to
  axiClk, and trigOut carries the NTRIGGERS_G outputs.

LCLS-II/evr/rtl/EvrV2Pkg.vhd: >-
  Types and constants of the LCLS-II EVR: the EvrV2ChannelConfig record (81
  bits as a vector) and the EvrV2TriggerConfigType record, with their init
  constants, array types, and conversion functions to and from bit vectors.
  It also holds the BSA, cache, and DMA record types and the tag constants,
  and the channel and trigger counts used by the fixed-size EVR.

LCLS-II/evr/rtl/EvrV2TrigReg.vhd: >-
  AXI-Lite register file for TRIGGERS_C EVR triggers. Each group, 256 bytes
  (4096 when EVR_CARD_G is true), holds the channel, polarity, complement
  enable, complement AND, and enable bits in its first word, then the delay
  and width words; with USE_TAP_C it adds a delay tap word whose write
  pulses loadTap once and whose upper bits read delay_rd. Group i drives
  triggerConfig(i).

LCLS-II/evr/rtl/EvrV2Trigger.vhd: >-
  One EVR trigger output. After its arm input is seen (the channel chosen by
  config.channel, or any channel in the config.channels mask when USE_MASK_G
  is true) and the next fire strobe arrives, it queues a pulse in a FIFO
  that a state machine plays out as an edge config.delay clocks after the
  strobe lasting config.width clocks. A pulse is skipped when it would start
  before the previous queued pulse has ended or when the width is 0, and
  polarity sets the pulse level.

LCLS-II/evr/rtl/EvrV2TriggerCompl.vhd: >-
  Complementary stage for a pair of trigger outputs. For each output,
  complEn low passes its own trigIn through, and otherwise the output is the
  AND (complAnd high) or OR (complAnd low) of both trigIn bits. The result
  is combinational, or one clock later when REG_OUT_G is true, and trigOut
  is 0 while rst is high.

LCLS-II/evr/tb/EvrV2_tb.vhd: >-
  Free-running bench for the EVR blocks with 12 channels and 12 trigger
  outputs on a 5.4 ns evrClk, with a TPGMini and a TimingDeserializer
  producing the timing bus for EvrV2EventSelect and EvrV2Trigger instances.
  It also instantiates EvrV2Dma, EvrV2BsaControl, EvrV2BsaChannel, and
  EvrV2EventDma and uses an ExptBusType that nothing in the repository
  declares, so it is stale and GHDL cannot analyze it.

LCLS-II/gthUltraScale+/rtl/TimingGthCoreWrapper.vhd: >-
  Timing transceiver wrapper for the UltraScale+ GTHE4, built like the
  Kintex UltraScale wrapper with the TimingGth_fixedlat or, with EXTREF_G,
  the TimingGth_extref IP core, a dummy channel when DISABLE_TIME_GT_G is
  true, and an AXI-Lite crossbar for GtRxAlignCheck and the DRP bridge. Its
  entity is TimingGthCoreWrapper, not TimingGtCoreWrapper, and its TX user
  clock and data ports have defaults.

LCLS-II/gthUltraScale/rtl/TimingGtCoreWrapper.vhd: >-
  Timing transceiver wrapper for the Kintex UltraScale GTHE3. It
  instantiates the TimingGth_fixedlat or, with EXTREF_G, the
  TimingGth_extref IP core, or ties the channel off with a dummy when
  DISABLE_TIME_GT_G is true, and an AXI-Lite crossbar gives a surf
  GtRxAlignCheck and a DRP bridge access to the channel. The IP comes from
  the coregen directory that ruckus selects by Vivado version.

LCLS-II/gtp7/rtl/TimingGtCoreWrapper.vhd: >-
  Timing transceiver wrapper for the Artix-7 GTP: a surf Gtp7Core with the
  8b10b decoder, the RX and TX output reset synchronizers, and an AXI-Lite
  to DRP bridge, presenting 16-bit rxData and txData paths with K flags and
  the timing PHY control and status records. PLL_G selects the PLL and
  GT_CONFIG_G selects the LCLS-I or LCLS-II line configuration.

LCLS-II/gtx7/rtl/TimingGtCoreWrapper.vhd: >-
  Timing transceiver wrapper for the Kintex-7 GTX: a surf Gtx7Core with
  power-up resets, the 8b10b decoder, RX and TX output reset synchronizers,
  and an AXI-Lite to DRP bridge. Generics select the CPLL reference clock,
  whether the reference comes from gtRefClkP and gtRefClkN or from
  gtRefClkIn, the CDR lock wait, the stable clock period, and the LCLS-I or
  LCLS-II line configuration.

LCLS-II/gtyUltraScale+/rtl/TimingGtCoreWrapper.vhd: >-
  Timing transceiver wrapper for the UltraScale+ GTYE4, built like the GTH
  wrappers with the TimingGty_fixedlat or, with EXTREF_G, the
  TimingGty_extref IP core, a dummy channel when DISABLE_TIME_GT_G is true,
  and an AXI-Lite crossbar for GtRxAlignCheck and the DRP bridge. With
  LCLS1_ONLY_G true the local reference core is TimingGty_fixedlat_Lcls1Only
  instead.
