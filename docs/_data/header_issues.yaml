# Files whose banner Description is empty, missing, or contradicts what the
# file does, keyed by repo-relative path.
#
#   kind: empty        the Description field has no text
#   kind: missing      the file has no Description field in its first 60 lines
#   kind: contradicts  the Description describes something the file does not
#                      do; the entry also carries the current text as header
#
# Each entry links a filed issue or says pending until one is filed. The
# empty and missing entries are checked against the files in both directions,
# so writing a header or adding a file with an empty one fails the test until
# this file follows. Production headers are never edited from here.

